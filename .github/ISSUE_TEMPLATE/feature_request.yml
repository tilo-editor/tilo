name: Feature request
description: Suggest an improvement for Tilo.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Tilo do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editing
        - Palette
        - Settings
        - Themes
        - Markdown
        - Timeline
        - LSP
        - Terminal workflow
        - Packaging
        - Other
    validations:
      required: true
